<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Direct Messenger</title>
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #050508;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Apple Glow Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
      animation: floatOrb 14s infinite alternate ease-in-out;
    }
    .orb-1 { width: 340px; height: 340px; background: radial-gradient(circle, #7a22ff, #0051ff); top: 5%; left: 5%; }
    .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, #ff2a7a, #9900ff); bottom: 5%; right: 5%; animation-delay: -6s; }
    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    /* Responsive App Layout: Mobile View on phones, Dual-Pane Split on Desktop */
    .app-layout {
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      background: rgba(18, 18, 26, 0.65);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .app-layout {
        max-width: 1050px;
        height: 88vh;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      border-radius: 26px;
    }

    .btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.08));
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.96); opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #007aff, #5856d6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 22px rgba(0, 122, 255, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 12px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: rgba(255, 255, 255, 0.45); }

    /* AUTH SCREEN */
    #authOverlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(5, 5, 8, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .auth-header { text-align: center; }
    .auth-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ffffff 40%, rgba(255,255,255,0.45));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-weight: 600;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .sidebar {
        width: 360px;
      }
    }

    .glass-nav {
      padding: max(14px, env(safe-area-inset-top)) 16px 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 64px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-btn:active { transform: scale(0.92); }

    .notification-dot {
      width: 9px;
      height: 9px;
      background-color: #ff3b30;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      right: 1px;
      border: 2px solid #14141d;
      display: none;
    }

    .section-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: background 0.2s;
    }
    .list-item:hover { background: rgba(255, 255, 255, 0.1); }
    .list-item:active { transform: scale(0.98); }
    .list-item.selected {
      background: rgba(0, 122, 255, 0.2);
      border-color: rgba(0, 122, 255, 0.4);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2a7a, #7a22ff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-right: 12px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(122, 34, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .item-meta { flex: 1; display: flex; flex-direction: column; }
    .item-meta .title { font-size: 0.95rem; font-weight: 600; }
    .item-meta .subtitle { font-size: 0.76rem; color: rgba(255, 255, 255, 0.5); }

    /* RIGHT CHAT PANEL */
    .chat-panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: absolute;
      inset: 0;
      background: rgba(18, 18, 26, 0.96);
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    @media (min-width: 768px) {
      .chat-panel {
        position: relative;
        transform: translateX(0) !important;
        background: transparent;
      }
    }

    .chat-panel.active {
      transform: translateX(0);
    }

    .back-btn-mobile {
      display: flex;
    }
    @media (min-width: 768px) {
      .back-btn-mobile {
        display: none !important;
      }
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-chat-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: rgba(255, 255, 255, 0.4);
      gap: 8px;
      font-size: 0.95rem;
    }

    .bubble {
      max-width: 74%;
      padding: 10px 15px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
      animation: popAnim 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      backdrop-filter: blur(20px);
    }
    @keyframes popAnim {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bubble.outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(123, 63, 228, 0.88), rgba(217, 46, 127, 0.88));
      color: #fff;
      border-radius: 22px 22px 5px 22px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 18px rgba(123, 63, 228, 0.35);
    }

    .bubble.incoming {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.12);
      color: #f1f1f1;
      border-radius: 22px 22px 22px 5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .bubble-time {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 3px;
      display: block;
      text-align: right;
    }

    .chat-input-bar {
      padding: 12px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .chat-input-bar input {
      flex: 1;
      border-radius: 24px;
      padding: 11px 18px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007aff, #5856d6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    /* Modal Overlays */
    .dialog-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 60;
    }
    .dialog-card {
      padding: 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- AUTH SCREEN -->
  <div id="authOverlay">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <h1>Direct</h1>
        <p style="font-size: 0.85rem; color: rgba(255,255,255,0.55); margin-top: 4px;">Zero-Delay Private Messenger</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="loginTabBtn" onclick="toggleAuthTab('login')">Log In</div>
        <div class="auth-tab" id="signupTabBtn" onclick="toggleAuthTab('signup')">Sign Up</div>
      </div>

      <input type="text" id="usernameInput" placeholder="Your Name" style="display:none;" />
      <input type="text" id="usercodeInput" placeholder="Your Secret Code (e.g. 1024)" maxlength="8" />
      <input type="password" id="passwordInput" placeholder="Password" />

      <button class="btn btn-primary" id="authSubmitBtn" onclick="handleAuthSubmit()">Log In</button>
      <div id="authError" style="color: #ff453a; font-size: 0.82rem; text-align: center;"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="app-layout">
    
    <!-- LEFT PANEL: INBOX / CONTACTS -->
    <div class="sidebar">
      <div class="glass-nav">
        <div>
          <h2 id="inboxUsernameTitle">Direct</h2>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);" id="inboxUserCode">Code: ----</div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="icon-btn" onclick="openAddFriendModal()">&#10010;</button>
          <button class="icon-btn" onclick="openRequestsModal()">
            &#128276;
            <div class="notification-dot" id="requestsDot"></div>
          </button>
          <button class="icon-btn" onclick="handleLogout()" style="font-size: 0.95rem;">&#8617;</button>
        </div>
      </div>

      <div class="section-list" id="friendsList">
        <div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 50px;">
          No conversations yet.<br>Tap '+' above to add friends.
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: CHAT SCREEN -->
    <div class="chat-panel" id="chatPanel">
      <div class="glass-nav" id="chatHeader" style="display: none;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="icon-btn back-btn-mobile" style="width: 34px; height: 34px;" onclick="closeChatMobile()">&#10094;</button>
          <div class="avatar" id="chatPartnerAvatar" style="width: 38px; height: 38px; font-size: 1rem; margin: 0;">?</div>
          <div>
            <h3 id="chatPartnerName" style="font-size: 0.94rem; font-weight: 600;">Friend</h3>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);" id="chatPartnerCode">Code: ----</div>
          </div>
        </div>
      </div>

      <div class="empty-chat-placeholder" id="emptyPlaceholder">
        <span style="font-size: 2.2rem; opacity: 0.6;">💬</span>
        <span>Select a friend or enter a code to start chatting</span>
      </div>

      <div class="chat-body" id="chatBody" style="display: none;"></div>

      <form class="chat-input-bar" id="chatInputBar" style="display: none;" onsubmit="handleSendMessage(event)">
        <input type="text" id="chatMessageInput" placeholder="Message..." autocomplete="off" />
        <button type="submit" class="send-btn">&#10148;</button>
      </form>
    </div>

  </div>

  <!-- ADD FRIEND MODAL -->
  <div class="dialog-overlay" id="addFriendModal">
    <div class="glass-card dialog-card">
      <h3 style="font-size: 1.05rem;">Add Friend by Code</h3>
      <p style="font-size: 0.8rem; color: rgba(255,255,255,0.55);">Search for your friend's secret code.</p>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="friendSearchCode" placeholder="Code (e.g. 7482)" style="flex: 1;" />
        <button class="btn btn-primary" style="padding: 10px 16px;" onclick="searchFriendByCode()">Find</button>
      </div>
      <div id="friendSearchResult" style="min-height: 40px; display: flex; align-items: center; justify-content: center;"></div>
      <button class="btn btn-secondary" onclick="closeAddFriendModal()">Cancel</button>
    </div>
  </div>

  <!-- REQUESTS MODAL -->
  <div class="dialog-overlay" id="requestsModal">
    <div class="glass-card dialog-card">
      <h3 style="font-size: 1.05rem;">Friend Requests</h3>
      <div id="requestsContainer" style="max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
        <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); text-align: center;">No pending requests.</p>
      </div>
      <button class="btn btn-secondary" onclick="closeRequestsModal()">Close</button>
    </div>
  </div>

  <script>
    // ================= INTEGRATED YOUR FIREBASE KEYS =================
    const firebaseConfig = {
      apiKey: "AIzaSyBPAPlMU4S-6yKhDYZyNMkABzF0jE16dTo",
      authDomain: "my-direct-85333.firebaseapp.com",
      databaseURL: "https://my-direct-85333-default-rtdb.firebaseio.com",
      projectId: "my-direct-85333",
      storageBucket: "my-direct-85333.firebasestorage.app",
      messagingSenderId: "831029091786",
      appId: "1:831029091786:web:9c75ae141ec1828165c333"
    };

    // Google Sheets Webhook for permanent spreadsheet backups
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwUNgUls29dL9yHK5mZGwA_lv88mRkIfZjKQvoMXN72mJCvMC53FV1E2cTnewm1F0Q/exec";

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // App State
    let currentUser = null;
    let activeFriend = null;
    let authMode = 'login';
    let activeChatListener = null;

    // Silent Google Sheet Backup (Logs data to sheet in background)
    function backupToGoogleSheet(payload) {
      try {
        fetch(GOOGLE_SHEET_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch (e) {}
    }

    // ================= AUTHENTICATION =================
    function toggleAuthTab(mode) {
      authMode = mode;
      document.getElementById('loginTabBtn').classList.toggle('active', mode === 'login');
      document.getElementById('signupTabBtn').classList.toggle('active', mode === 'signup');
      document.getElementById('usernameInput').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('authSubmitBtn').innerText = mode === 'signup' ? 'Create Account' : 'Log In';
      document.getElementById('authError').innerText = '';
    }

    async function handleAuthSubmit() {
      const code = document.getElementById('usercodeInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const errorEl = document.getElementById('authError');
      const submitBtn = document.getElementById('authSubmitBtn');
      errorEl.innerText = '';

      if (!code || !pass) {
        errorEl.innerText = 'Please complete all fields.';
        return;
      }

      submitBtn.disabled = true;

      try {
        const userRef = db.ref('users/' + code);
        const snapshot = await userRef.get();

        if (authMode === 'signup') {
          const name = document.getElementById('usernameInput').value.trim();
          if (!name) {
            errorEl.innerText = 'Username is required.';
            submitBtn.disabled = false;
            return;
          }

          if (snapshot.exists()) {
            errorEl.innerText = 'This code is already taken. Pick another.';
            submitBtn.disabled = false;
            return;
          }

          // 1. Save in Firebase (Instant)
          await userRef.set({
            user_code: code,
            username: name,
            password: pass
          });

          // 2. Backup in Google Sheet (Permanent)
          backupToGoogleSheet({
            action: 'signup',
            user_code: code,
            username: name,
            password: pass
          });

          currentUser = { user_code: code, username: name };
          loginSuccess();

        } else {
          if (!snapshot.exists()) {
            errorEl.innerText = 'Code not found. Please Sign Up.';
            submitBtn.disabled = false;
            return;
          }

          const userData = snapshot.val();
          if (String(userData.password) !== String(pass)) {
            errorEl.innerText = 'Incorrect password.';
            submitBtn.disabled = false;
            return;
          }

          currentUser = { user_code: userData.user_code, username: userData.username };
          loginSuccess();
        }
      } catch (err) {
        errorEl.innerText = 'Connection error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }

    function loginSuccess() {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('inboxUsernameTitle').innerText = currentUser.username;
      document.getElementById('inboxUserCode').innerText = `Your Code: ${currentUser.user_code}`;

      // Start Realtime Friends & Requests Listeners
      listenToFriendsAndRequests();
    }

    function handleLogout() {
      if (activeChatListener) activeChatListener.off();
      currentUser = null;
      activeFriend = null;
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('friendsList').innerHTML = '';
      closeChatMobile();
    }

    // ================= REALTIME INBOX & FRIEND SYSTEM =================
    function listenToFriendsAndRequests() {
      db.ref('friends').on('value', async (snapshot) => {
        const data = snapshot.val() || {};
        const friendCodes = new Set();
        const pending = [];

        for (let key in data) {
          const item = data[key];
          if (item.status === 'accepted') {
            if (item.requester_code === currentUser.user_code) friendCodes.add(item.receiver_code);
            if (item.receiver_code === currentUser.user_code) friendCodes.add(item.requester_code);
          } else if (item.status === 'pending' && item.receiver_code === currentUser.user_code) {
            pending.push({ key, requester_code: item.requester_code });
          }
        }

        const dot = document.getElementById('requestsDot');
        dot.style.display = pending.length > 0 ? 'block' : 'none';

        renderFriendsList(Array.from(friendCodes));
      });
    }

    async function renderFriendsList(friendCodes) {
      const listContainer = document.getElementById('friendsList');
      if (friendCodes.length === 0) {
        listContainer.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 50px;">No friends yet.<br>Tap '+' to connect by code.</div>`;
        return;
      }

      listContainer.innerHTML = '';
      for (let code of friendCodes) {
        const snap = await db.ref('users/' + code).get();
        const info = snap.val() || { username: 'User', user_code: code };

        const item = document.createElement('div');
        item.className = 'list-item' + (activeFriend && activeFriend.user_code === code ? ' selected' : '');
        item.onclick = () => openChat({ user_code: code, username: info.username });

        item.innerHTML = `
          <div style="display: flex; align-items: center;">
            <div class="avatar">${info.username.charAt(0).toUpperCase()}</div>
            <div class="item-meta">
              <span class="title">${escapeHtml(info.username)}</span>
              <span class="subtitle">Code: ${code}</span>
            </div>
          </div>
          <span style="color: rgba(255,255,255,0.4); font-size: 1rem;">&#10095;</span>
        `;
        listContainer.appendChild(item);
      }
    }

    // ================= FRIEND SEARCH & REQUESTS =================
    function openAddFriendModal() {
      document.getElementById('friendSearchCode').value = '';
      document.getElementById('friendSearchResult').innerHTML = '';
      document.getElementById('addFriendModal').style.display = 'flex';
    }
    function closeAddFriendModal() { document.getElementById('addFriendModal').style.display = 'none'; }

    async function searchFriendByCode() {
      const code = document.getElementById('friendSearchCode').value.trim();
      const resContainer = document.getElementById('friendSearchResult');
      resContainer.innerHTML = '<span style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">Searching...</span>';

      if (!code) return;
      if (code === currentUser.user_code) {
        resContainer.innerHTML = '<span style="color: #ff453a; font-size: 0.8rem;">Cannot add your own code.</span>';
        return;
      }

      const snap = await db.ref('users/' + code).get();
      if (!snap.exists()) {
        resContainer.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">No user found with this code.</span>';
        return;
      }

      const found = snap.val();
      resContainer.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 4px 0;">
          <div>
            <strong>${escapeHtml(found.username)}</strong>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);">Code: ${found.user_code}</div>
          </div>
          <button class="btn btn-primary" style="padding: 7px 14px; font-size: 0.8rem;" onclick="sendFriendRequest('${found.user_code}')">Connect</button>
        </div>
      `;
    }

    async function sendFriendRequest(targetCode) {
      const relId = [currentUser.user_code, targetCode].sort().join('_');
      await db.ref('friends/' + relId).set({
        requester_code: currentUser.user_code,
        receiver_code: targetCode,
        status: 'pending'
      });

      // Sheet backup
      backupToGoogleSheet({
        action: 'send_request',
        requester_code: currentUser.user_code,
        receiver_code: targetCode
      });

      alert('Request sent!');
      closeAddFriendModal();
    }

    async function openRequestsModal() {
      const container = document.getElementById('requestsContainer');
      container.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 0.8rem; text-align: center;">Loading...</span>';
      document.getElementById('requestsModal').style.display = 'flex';

      const snap = await db.ref('friends').get();
      const all = snap.val() || {};
      const pending = [];

      for (let key in all) {
        if (all[key].status === 'pending' && all[key].receiver_code === currentUser.user_code) {
          pending.push({ key, requester_code: all[key].requester_code });
        }
      }

      if (pending.length === 0) {
        container.innerHTML = '<p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); text-align: center;">No pending requests.</p>';
        return;
      }

      container.innerHTML = '';
      for (let req of pending) {
        const uSnap = await db.ref('users/' + req.requester_code).get();
        const uInfo = uSnap.val() || { username: 'User' };

        const row = document.createElement('div');
        row.style = 'display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1);';
        row.innerHTML = `
          <div>
            <div style="font-weight: 600; font-size: 0.9rem;">${escapeHtml(uInfo.username)}</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);">Code: ${req.requester_code}</div>
          </div>
          <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="acceptRequest('${req.key}', '${req.requester_code}')">Accept</button>
        `;
        container.appendChild(row);
      }
    }

    async function acceptRequest(key, reqCode) {
      await db.ref('friends/' + key).update({ status: 'accepted' });

      // Sheet backup
      backupToGoogleSheet({
        action: 'accept_request',
        requester_code: reqCode,
        receiver_code: currentUser.user_code
      });

      alert('Connected!');
      closeRequestsModal();
    }
    function closeRequestsModal() { document.getElementById('requestsModal').style.display = 'none'; }

    // ================= ZERO-DELAY REALTIME CHAT ENGINE =================
    function getChatId(codeA, codeB) {
      return [String(codeA), String(codeB)].sort().join('_');
    }

    function openChat(friend) {
      activeFriend = friend;

      document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));

      const chatPanel = document.getElementById('chatPanel');
      chatPanel.classList.add('active');

      document.getElementById('emptyPlaceholder').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('chatBody').style.display = 'flex';
      document.getElementById('chatInputBar').style.display = 'flex';

      document.getElementById('chatPartnerName').innerText = friend.username;
      document.getElementById('chatPartnerCode').innerText = `Code: ${friend.user_code}`;
      document.getElementById('chatPartnerAvatar').innerText = friend.username.charAt(0).toUpperCase();

      const chatBody = document.getElementById('chatBody');
      chatBody.innerHTML = '';

      if (activeChatListener) activeChatListener.off();

      const chatId = getChatId(currentUser.user_code, activeFriend.user_code);
      activeChatListener = db.ref('messages/' + chatId);

      // Instant push on child_added (< 0.1s websocket sync)
      activeChatListener.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        renderBubble(msg);
      });
    }

    function closeChatMobile() {
      activeFriend = null;
      if (activeChatListener) activeChatListener.off();
      document.getElementById('chatPanel').classList.remove('active');
    }

    function renderBubble(msg) {
      const chatBody = document.getElementById('chatBody');
      const isOutgoing = String(msg.sender_code) === String(currentUser.user_code);

      const bubble = document.createElement('div');
      bubble.className = `bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
      bubble.innerHTML = `
        ${escapeHtml(msg.message)}
        <span class="bubble-time">${msg.timestamp || ''}</span>
      `;
      chatBody.appendChild(bubble);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function handleSendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('chatMessageInput');
      const text = input.value.trim();
      if (!text || !activeFriend) return;

      const chatId = getChatId(currentUser.user_code, activeFriend.user_code);
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      input.value = '';

      // 1. Firebase write (Instant sync to both screens)
      await db.ref('messages/' + chatId).push({
        sender_code: currentUser.user_code,
        message: text,
        timestamp: timeStr
      });

      // 2. Google Sheet Backup (Logs message row in sheet)
      backupToGoogleSheet({
        action: 'send_message',
        chat_id: chatId,
        sender_code: currentUser.user_code,
        message: text,
        timestamp: timeStr
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
