<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iDirect Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #050508;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Apple Glow Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }
    .orb-1 { width: 260px; height: 260px; background: radial-gradient(circle, #7a22ff, #0051ff); top: 5%; left: 5%; }
    .orb-2 { width: 300px; height: 300px; background: radial-gradient(circle, #ff2a7a, #9900ff); bottom: 10%; right: 5%; animation-delay: -5s; }
    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    /* Mobile Container Frame */
    .mobile-frame {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(18, 18, 26, 0.55);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
    }

    @media (min-width: 480px) and (min-height: 700px) {
      .mobile-frame {
        height: 90dvh;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      }
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border-radius: 28px;
    }

    .btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.08));
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: transform 0.15s ease, opacity 0.2s;
    }
    .btn:active { transform: scale(0.96); opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #007aff, #5856d6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 22px rgba(0, 122, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 13px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      transition: border 0.2s;
    }
    input:focus { border-color: rgba(255, 255, 255, 0.45); }

    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }
    .auth-card {
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-header { text-align: center; margin-bottom: 4px; }
    .auth-header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ffffff 40%, rgba(255,255,255,0.45));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-weight: 600;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      border-radius: 16px;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    .glass-nav {
      padding: max(14px, env(safe-area-inset-top)) 16px 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .glass-nav h2 { font-size: 1.2rem; font-weight: 700; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      position: relative;
    }
    .icon-btn:active { transform: scale(0.92); }

    .notification-dot {
      width: 9px;
      height: 9px;
      background-color: #ff3b30;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      right: 1px;
      border: 2px solid #14141d;
      display: none;
    }

    .section-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }
    .list-item:active { transform: scale(0.98); }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2a7a, #7a22ff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-right: 12px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(122, 34, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .item-meta { flex: 1; display: flex; flex-direction: column; }
    .item-meta .title { font-size: 0.95rem; font-weight: 600; }
    .item-meta .subtitle { font-size: 0.76rem; color: rgba(255, 255, 255, 0.5); }

    .chat-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bubble {
      max-width: 74%;
      padding: 10px 15px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
      animation: popAnim 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }
    @keyframes popAnim {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .bubble.outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(123, 63, 228, 0.88), rgba(217, 46, 127, 0.88));
      color: #fff;
      border-radius: 22px 22px 5px 22px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 20px rgba(123, 63, 228, 0.35);
    }

    .bubble.incoming {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.12);
      color: #f1f1f1;
      border-radius: 22px 22px 22px 5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .bubble-time {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 3px;
      display: block;
      text-align: right;
    }

    .chat-input-bar {
      padding: 10px 14px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .chat-input-bar input {
      flex: 1;
      border-radius: 24px;
      padding: 11px 18px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007aff, #5856d6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1.05rem;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
      flex-shrink: 0;
    }
    .send-btn:active { transform: scale(0.9); }

    .dialog-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
    }
    .dialog-card {
      padding: 22px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="mobile-frame">
    <!-- AUTH -->
    <div id="authScreen" class="screen active">
      <div class="auth-container">
        <div class="glass-card auth-card">
          <div class="auth-header">
            <h1>Direct</h1>
            <p style="font-size: 0.82rem; color: rgba(255,255,255,0.55); margin-top: 4px;">Liquid Glass Messenger</p>
          </div>

          <div class="auth-tabs">
            <div class="auth-tab active" id="loginTabBtn" onclick="toggleAuthTab('login')">Log In</div>
            <div class="auth-tab" id="signupTabBtn" onclick="toggleAuthTab('signup')">Sign Up</div>
          </div>

          <input type="text" id="usernameInput" placeholder="Your Name" style="display:none;" />
          <input type="text" id="usercodeInput" placeholder="Secret Code (e.g. 1234)" maxlength="8" />
          <input type="password" id="passwordInput" placeholder="Password" />

          <button class="btn btn-primary" id="authSubmitBtn" onclick="handleAuthSubmit()">Log In</button>
          <div id="authError" style="color: #ff453a; font-size: 0.8rem; text-align: center;"></div>
        </div>
      </div>
    </div>

    <!-- INBOX -->
    <div id="inboxScreen" class="screen">
      <div class="glass-nav">
        <div>
          <h2 id="inboxUsernameTitle">Direct</h2>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);" id="inboxUserCode">Code: ----</div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="icon-btn" onclick="openAddFriendModal()">&#10010;</button>
          <button class="icon-btn" onclick="openRequestsModal()">
            &#128276;
            <div class="notification-dot" id="requestsDot"></div>
          </button>
          <button class="icon-btn" onclick="handleLogout()" style="font-size: 0.95rem;">&#8617;</button>
        </div>
      </div>

      <div class="section-list" id="friendsList">
        <div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 50px;">
          No conversations yet.<br>Tap '+' above to add friends.
        </div>
      </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chatScreen" class="screen">
      <div class="glass-nav">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="icon-btn" style="width: 34px; height: 34px;" onclick="backToInbox()">&#10094;</button>
          <div class="avatar" id="chatPartnerAvatar" style="width: 36px; height: 36px; font-size: 0.95rem; margin: 0;">?</div>
          <div>
            <h3 id="chatPartnerName" style="font-size: 0.92rem; font-weight: 600;">Friend</h3>
            <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5);" id="chatPartnerCode">Code: ----</div>
          </div>
        </div>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <form class="chat-input-bar" onsubmit="handleSendMessage(event)">
        <input type="text" id="chatMessageInput" placeholder="Message..." autocomplete="off" />
        <button type="submit" class="send-btn">&#10148;</button>
      </form>
    </div>

    <!-- MODAL: ADD FRIEND -->
    <div class="dialog-overlay" id="addFriendModal">
      <div class="glass-card dialog-card">
        <h3 style="font-size: 1rem;">Add Friend by Code</h3>
        <p style="font-size: 0.78rem; color: rgba(255,255,255,0.55);">Search for your friend's secret code.</p>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="friendSearchCode" placeholder="Code (e.g. 7482)" style="flex: 1;" />
          <button class="btn btn-primary" style="padding: 10px 16px;" onclick="searchFriendByCode()">Find</button>
        </div>
        <div id="friendSearchResult" style="min-height: 40px; display: flex; align-items: center; justify-content: center;"></div>
        <button class="btn btn-secondary" onclick="closeAddFriendModal()">Cancel</button>
      </div>
    </div>

    <!-- MODAL: REQUESTS -->
    <div class="dialog-overlay" id="requestsModal">
      <div class="glass-card dialog-card">
        <h3 style="font-size: 1rem;">Friend Requests</h3>
        <div id="requestsContainer" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
          <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); text-align: center;">No pending requests.</p>
        </div>
        <button class="btn btn-secondary" onclick="closeRequestsModal()">Close</button>
      </div>
    </div>

  </div>

  <script>
    // ================= CONNECTED YOUR LIVE SCRIPT URL =================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUNgUls29dL9yHK5mZGwA_lv88mRkIfZjKQvoMXN72mJCvMC53FV1E2cTnewm1F0Q/exec";

    const INBOX_POLL_INTERVAL = 3500;
    const CHAT_POLL_INTERVAL = 1500; // 1.5 seconds fast real-time sync

    let currentUser = null;
    let activeFriend = null;
    let renderedMessageIds = new Set();
    let inboxPoller = null;
    let chatPoller = null;
    let authMode = 'login';

    async function callAPI(params) {
      const url = new URL(SCRIPT_URL);
      Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
      const res = await fetch(url.toString(), {
        method: 'GET',
        mode: 'cors',
        redirect: 'follow'
      });
      return res.json();
    }

    // ================= AUTH =================
    function toggleAuthTab(mode) {
      authMode = mode;
      document.getElementById('loginTabBtn').classList.toggle('active', mode === 'login');
      document.getElementById('signupTabBtn').classList.toggle('active', mode === 'signup');
      document.getElementById('usernameInput').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('authSubmitBtn').innerText = mode === 'signup' ? 'Create Account' : 'Log In';
      document.getElementById('authError').innerText = '';
    }

    async function handleAuthSubmit() {
      const code = document.getElementById('usercodeInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const errorEl = document.getElementById('authError');
      const submitBtn = document.getElementById('authSubmitBtn');
      errorEl.innerText = '';

      if (!code || !pass) {
        errorEl.innerText = 'Please fill in all fields.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Please wait...";

      try {
        if (authMode === 'signup') {
          const name = document.getElementById('usernameInput').value.trim();
          if (!name) {
            errorEl.innerText = 'Username is required.';
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Account";
            return;
          }

          const res = await callAPI({ action: 'signup', user_code: code, username: name, password: pass });
          if (!res.success) {
            errorEl.innerText = res.message || 'Signup failed.';
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Account";
            return;
          }

          currentUser = { user_code: String(code), username: name };
          bootInbox();

        } else {
          const res = await callAPI({ action: 'login', user_code: code, password: pass });
          if (!res.success) {
            errorEl.innerText = res.message || 'Invalid Code or Password.';
            submitBtn.disabled = false;
            submitBtn.innerText = "Log In";
            return;
          }

          currentUser = { user_code: String(res.user.user_code), username: res.user.username };
          bootInbox();
        }
      } catch (err) {
        errorEl.innerText = 'Server error. Please verify Apps Script deployment.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = authMode === 'signup' ? 'Create Account' : 'Log In';
      }
    }

    function handleLogout() {
      clearInterval(inboxPoller);
      clearInterval(chatPoller);
      currentUser = null;
      activeFriend = null;
      document.getElementById('inboxScreen').classList.remove('active');
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('authScreen').classList.add('active');
    }

    // ================= INBOX =================
    function bootInbox() {
      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('inboxScreen').classList.add('active');
      document.getElementById('inboxUsernameTitle').innerText = currentUser.username;
      document.getElementById('inboxUserCode').innerText = `Your Code: ${currentUser.user_code}`;

      refreshInboxData();
      clearInterval(inboxPoller);
      inboxPoller = setInterval(refreshInboxData, INBOX_POLL_INTERVAL);
    }

    async function refreshInboxData() {
      if (!currentUser) return;
      try {
        const res = await callAPI({ action: 'get_inbox', user_code: currentUser.user_code });
        if (res.success) {
          renderFriends(res.friends || []);
          const dot = document.getElementById('requestsDot');
          dot.style.display = (res.pending && res.pending.length > 0) ? 'block' : 'none';
        }
      } catch (e) {}
    }

    function renderFriends(friends) {
      const listContainer = document.getElementById('friendsList');
      if (friends.length === 0) {
        listContainer.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.4); margin-top: 50px;">No friends added yet.<br>Tap '+' above to add friends.</div>`;
        return;
      }

      listContainer.innerHTML = '';
      friends.forEach(f => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.onclick = () => openChat(f);

        item.innerHTML = `
          <div style="display: flex; align-items: center;">
            <div class="avatar">${f.username.charAt(0).toUpperCase()}</div>
            <div class="item-meta">
              <span class="title">${escapeHtml(f.username)}</span>
              <span class="subtitle">Code: ${f.user_code}</span>
            </div>
          </div>
          <span style="color: rgba(255,255,255,0.4); font-size: 1rem;">&#10095;</span>
        `;
        listContainer.appendChild(item);
      });
    }

    // ================= ADD FRIEND & REQUESTS =================
    function openAddFriendModal() {
      document.getElementById('friendSearchCode').value = '';
      document.getElementById('friendSearchResult').innerHTML = '';
      document.getElementById('addFriendModal').style.display = 'flex';
    }
    function closeAddFriendModal() { document.getElementById('addFriendModal').style.display = 'none'; }

    async function searchFriendByCode() {
      const code = document.getElementById('friendSearchCode').value.trim();
      const resContainer = document.getElementById('friendSearchResult');
      resContainer.innerHTML = '<span style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">Searching...</span>';

      if (!code) return;
      if (code === currentUser.user_code) {
        resContainer.innerHTML = '<span style="color: #ff453a; font-size: 0.8rem;">Cannot add your own code.</span>';
        return;
      }

      try {
        const res = await callAPI({ action: 'search_user', user_code: code });
        if (!res.success || !res.user) {
          resContainer.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">No user found.</span>';
          return;
        }

        const found = res.user;
        resContainer.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 4px 0;">
            <div>
              <strong>${escapeHtml(found.username)}</strong>
              <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);">Code: ${found.user_code}</div>
            </div>
            <button class="btn btn-primary" style="padding: 7px 14px; font-size: 0.8rem;" onclick="sendFriendRequest('${found.user_code}')">Connect</button>
          </div>
        `;
      } catch (err) {
        resContainer.innerHTML = `<span style="color: #ff453a; font-size: 0.8rem;">Error searching.</span>`;
      }
    }

    async function sendFriendRequest(targetCode) {
      try {
        await callAPI({ action: 'send_request', requester_code: currentUser.user_code, receiver_code: targetCode });
        alert('Friend request sent!');
        closeAddFriendModal();
      } catch (err) {
        alert('Failed to send request.');
      }
    }

    async function openRequestsModal() {
      const container = document.getElementById('requestsContainer');
      container.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 0.8rem; text-align: center;">Loading...</span>';
      document.getElementById('requestsModal').style.display = 'flex';

      try {
        const res = await callAPI({ action: 'get_inbox', user_code: currentUser.user_code });
        const pending = res.pending || [];

        if (pending.length === 0) {
          container.innerHTML = '<p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); text-align: center;">No pending requests.</p>';
          return;
        }

        container.innerHTML = '';
        pending.forEach(req => {
          const row = document.createElement('div');
          row.style = 'display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1);';
          row.innerHTML = `
            <div>
              <div style="font-weight: 600; font-size: 0.9rem;">${escapeHtml(req.username)}</div>
              <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5);">Code: ${req.user_code}</div>
            </div>
            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="acceptRequest('${req.user_code}')">Accept</button>
          `;
          container.appendChild(row);
        });
      } catch (err) {
        container.innerHTML = `<span style="color: #ff453a; font-size: 0.8rem;">Failed to load.</span>`;
      }
    }

    async function acceptRequest(reqCode) {
      try {
        await callAPI({ action: 'accept_request', requester_code: reqCode, receiver_code: currentUser.user_code });
        alert('Connected!');
        closeRequestsModal();
        refreshInboxData();
      } catch (err) {
        alert('Failed to accept request.');
      }
    }

    function closeRequestsModal() { document.getElementById('requestsModal').style.display = 'none'; }

    // ================= REAL-TIME CHAT =================
    function getChatId(codeA, codeB) {
      return [String(codeA), String(codeB)].sort().join('_');
    }

    function openChat(friend) {
      activeFriend = friend;
      renderedMessageIds.clear();
      document.getElementById('chatBody').innerHTML = '';
      document.getElementById('chatPartnerName').innerText = friend.username;
      document.getElementById('chatPartnerCode').innerText = `Code: ${friend.user_code}`;
      document.getElementById('chatPartnerAvatar').innerText = friend.username.charAt(0).toUpperCase();

      document.getElementById('inboxScreen').classList.remove('active');
      document.getElementById('chatScreen').classList.add('active');

      fetchDirectMessages();
      clearInterval(chatPoller);
      chatPoller = setInterval(fetchDirectMessages, CHAT_POLL_INTERVAL);
    }

    function backToInbox() {
      clearInterval(chatPoller);
      activeFriend = null;
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('inboxScreen').classList.add('active');
      refreshInboxData();
    }

    async function fetchDirectMessages() {
      if (!activeFriend || !currentUser) return;
      const chatId = getChatId(currentUser.user_code, activeFriend.user_code);

      try {
        const res = await callAPI({ action: 'get_messages', chat_id: chatId });
        if (res.success && Array.isArray(res.messages)) {
          renderDirectMessages(res.messages);
        }
      } catch (err) {}
    }

    function renderDirectMessages(messages) {
      const chatBody = document.getElementById('chatBody');
      let shouldScroll = false;

      messages.forEach(msg => {
        const msgId = `${msg.timestamp}_${msg.sender_code}_${msg.message}`;
        if (!renderedMessageIds.has(msgId)) {
          renderedMessageIds.add(msgId);
          shouldScroll = true;

          const isOutgoing = String(msg.sender_code) === String(currentUser.user_code);
          const bubble = document.createElement('div');
          bubble.className = `bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
          bubble.innerHTML = `
            ${escapeHtml(msg.message)}
            <span class="bubble-time">${msg.timestamp || ''}</span>
          `;
          chatBody.appendChild(bubble);
        }
      });

      if (shouldScroll) {
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }

    async function handleSendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('chatMessageInput');
      const text = input.value.trim();
      if (!text || !activeFriend) return;

      const chatId = getChatId(currentUser.user_code, activeFriend.user_code);
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      input.value = '';

      // Instant Optimistic UI display
      const msgId = `${timeStr}_${currentUser.user_code}_${text}`;
      renderedMessageIds.add(msgId);
      const chatBody = document.getElementById('chatBody');
      const bubble = document.createElement('div');
      bubble.className = 'bubble outgoing';
      bubble.innerHTML = `${escapeHtml(text)}<span class="bubble-time">${timeStr}</span>`;
      chatBody.appendChild(bubble);
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        await callAPI({
          action: 'send_message',
          chat_id: chatId,
          sender_code: currentUser.user_code,
          message: text,
          timestamp: timeStr
        });
        fetchDirectMessages();
      } catch (err) {
        console.error("Failed to send message:", err);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
